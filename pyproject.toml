[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "syspulse"
version = "0.1.0"
description = "Modern, high-performance system health and network diagnostic CLI tool"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "psutil>=5.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    "ruff>=0.1.0",
]

[project.scripts]
syspulse = "syspulse.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/syspulse"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--cov=src/syspulse --cov-report=term-missing"
testpaths = [
    "tests",
]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
ignore = ["E501", "C901"]
